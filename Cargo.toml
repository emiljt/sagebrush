[package]
name = "sagebrush"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
